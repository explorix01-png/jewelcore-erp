name: JewelCore ERP CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck, Verify & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: jewelcore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/jewelcore_ci
      JWT_SECRET: ci-test-jwt-secret-key-32-characters-minimum-requirement

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npm run lint

      - name: Typecheck codebase
        run: npm run typecheck

      - name: Run multi-tenancy isolation tests
        run: npm run test:multitenancy

      - name: Run PostgreSQL verification tests
        run: npm run test:postgres

      - name: Run backend & business logic verification tests
        run: npm run test:backend

      - name: Build frontend production bundle
        run: npm run build
