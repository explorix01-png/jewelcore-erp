name: JewelCore ERP Production Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  pre-flight-checks:
    name: Full CI & Multi-Tenant Security Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: jewelcore_prod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jewelcore_prod_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/jewelcore_prod_test?sslmode=disable
      JWT_SECRET: production-preflight-jwt-secret-key-32-chars-min

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Security Tests
        run: |
          npm run lint
          npm run typecheck
          npm run test:postgres
          npm run test:multitenancy
          npm run test:backend
          npm run test:deep
          npm run test:client
          npm run test:qa

      - name: Build frontend production bundle
        run: npm run build

  deploy-production:
    name: Production Deployment (Approval Gated)
    needs: pre-flight-checks
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.jewelcore.in

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: jewelcore-prod-backend
      ECS_CLUSTER: jewelcore-prod-cluster
      ECS_SERVICE: jewelcore-prod-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Production Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          docker build \
            --build-arg NODE_ENV=production \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$GIT_SHA \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$GIT_SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to Amazon ECS Fargate (Production)
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Production ECS Service Stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

      - name: Production Health Smoke Test
        run: |
          if [ -n "${{ secrets.PROD_API_URL }}" ]; then
            echo "Verifying production health check..."
            curl --fail --retry 5 --retry-delay 5 "${{ secrets.PROD_API_URL }}/api/health" || exit 1
            echo "Production health check verified."
          else
            echo "PROD_API_URL secret not defined, skipping live HTTP ping"
          fi
