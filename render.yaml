# ===============================================================
# JewelCore ERP — Render Staging Deployment Blueprint
# ===============================================================
# This blueprint defines the isolated staging environment for JewelCore ERP.
# Features:
# - Free-tier Node.js web service serving backend API and PWA static assets (sleeps when idle)
# - Free managed PostgreSQL database (expires after 30 days; upgrade for persistence)
# - No persistent disk on the free tier: uploaded files are lost on redeploy
# - Automated secret generation for JWT
# - Built-in health check monitoring at /api/health
# ===============================================================

services:
  # -------------------------------------------------------------
  # Staging Web Service (Node.js + Express + React PWA)
  # -------------------------------------------------------------
  - type: web
    name: jewelcore-erp-staging
    env: node
    plan: free # Free tier: sleeps after 15 min idle (keep awake with UptimeRobot on /api/health)
    branch: main
    # CI/CD: Render deploys automatically on every push to main, but only after the GitHub
    # Actions CI workflow (.github/workflows/ci.yml) passes. A failing CI run blocks the deploy.
    autoDeployTrigger: checksPass
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true # Render securely generates a random secret on initial deploy
      - key: DATABASE_URL
        fromDatabase:
          name: jewelcore-db-staging
          property: connectionString
    # NOTE: free web services have no persistent disk, so ./uploads is wiped on every deploy/restart.

databases:
  # -------------------------------------------------------------
  # Canonical Managed PostgreSQL Database (Staging)
  # -------------------------------------------------------------
  - name: jewelcore-db-staging
    plan: free # Free Postgres expires 30 days after creation (1 GB); upgrade or recreate before then
    databaseName: jewelcore_erp_staging
    user: jewelcore_admin
